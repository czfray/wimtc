<html>
    <head>

        <link rel="manifest" href="manifest.json">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">

        <title>我架地鐵幾時嚟 WIMTC</title>
        <meta name="description" content="即時查詢香港港鐵列車到站時間 Check real-time MTR train arrival times in Hong Kong">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Xmind:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script type="module" src="train.js"></script>

        <link rel="icon" type="image/png" href="icon.png">
        <link rel="apple-touch-icon" href="icon.png">

    </head>
    <body>
        
        <button onclick="window.location.href='lrt.html'" class="lrtbut top">轉輕鐵 LRT</button>
        <h1 class="white bold center">
            <span class="big">我架<span class="red">地鐵</span>幾時嚟？</span>
            <br>
            <span class="medium">When is my <span class="red">train</span> coming?</span>
        </h1>
        
        <p id = "time" class = "dirtywhite center thin extrasmall">
            最後更新 Last Update: NA
        </p>

        <select id="selectLine" class="dirtywhite"></select>
        <select id="selectStn" class="dirtywhite"></select>
        <br>

        <div id="trainList"></div>

        <template id="lineTemplate">
            <h2 class="lineName dirtywhite small bold center"></h2>
            <div class="trains"></div>
        </template>

        <template id="trainTemplate">
            <p class="train white center nomargin">
                <span class="trainName"></span>
                <span class="trainMin0"></span>
                <span class="trainMin1"></span>
                <span class="trainMin2"></span>
                <span class="trainMin3"></span>
            </p>
        </template>

        <template id="failureTemplate">
            <br>
            <p class="failtc dirtywhite small bold center nomargin"></p>
            <p class="failen dirtywhite small thin center nomargin"></p>
        </template>

        <br>
        <p class="gray center extrasmall">
            © 2026 Chan Ray. All rights reserved. 
            <br>
            Not affiliated with MTR Corporation.
        </p>
        
    </body>

</html>
